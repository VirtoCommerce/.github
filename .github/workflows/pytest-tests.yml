# v3.800.42
# https://virtocommerce.atlassian.net/browse/VCST-5373
name: Auto tests

on:
  workflow_call:
    inputs:
      adminPassword:
        description: 'Admin Password'
        required: false
        type: string
        default: ''
      adminUsername:
        description: 'Admin Username'
        required: false
        type: string
        default: 'admin'
      apiKey:
        description: 'API Key'
        required: false
        type: string
        default: ''
      backUrl:
        description: 'Back URL'
        required: false
        type: string
        default: 'http://localhost:8090'
      baseUrl:
        description: 'Base URL'
        required: false
        type: string
        default: 'http://localhost'
      browser:
        required: false
        type: string
        default: 'chromium'
      customModuleId:
        description: 'Custom Module id'
        required: false
        type: string
        default: ''
      customModuleUrl:
        description: 'Custom module Module url'
        required: false
        type: string
        default: ''
      customPackagesJsonUrl:
        description: 'Custom packages.json url'
        required: false
        type: string
        default: ''
      databaseProviders:
        description: 'JSON array of database providers to run the test matrix against. Any subset of: sqlserver, mysql, postgres'
        required: false
        type: string
        default: '["sqlserver","mysql","postgres"]'
      frontendZipUrl:
        required: false
        type: string
        default: 'latest'
      installCustomModule:
        description: 'Enable or disable "Install Custom Modules" step'
        required: false
        type: string
        default: 'false'
      installModules:
        description: 'Enable or disable "Install Modules" step'
        required: false
        type: string
        default: 'true'
      platformDockerTag:
        description: 'Platform docker tag'
        required: false
        type: string
        default: 'local-latest'
      prebuiltImageArtifact:
        description: 'Name of a workflow artifact containing a docker save tar of the platform image. When set, the action downloads and loads it instead of building or pulling, and installModules / installCustomModule / customPackagesJsonUrl must be unset.'
        required: false
        type: string
        default: ''
      pytestMarkers:
        description: 'Additional pytest -m marker expression, AND-combined with each suite''s default markers. Leave empty to use defaults only.'
        required: false
        default: ''
        type: string
      requiredModulesListUrl:
        description: 'The URL of the JSON file with the required modules list'
        required: false
        type: string
        default: ''
      searchEngineVersion:
        description: 'Search engine image tag. Leave empty to use the default for the selected searchProvider: elasticsearch8 -> 8.18.0, elasticsearch9 -> 9.5.1, opensearch -> 2.18.0.'
        required: false
        type: string
        default: ''
      searchProviders:
        description: 'JSON array of search engines to cover in addition to the database matrix. Any subset of: elasticsearch8, elasticsearch9, opensearch. Each entry ADDS one job pinned to postgres; it does not cross with databaseProviders. The databaseProviders jobs resolve their own engine (from customModuleId, or a customPackagesJsonUrl pinning exactly one provider, else elasticsearch8). Empty means no extra jobs. The platform image must ship the module for every engine listed.'
        required: false
        type: string
        default: '[]'
      skipDocCountVerification:
        description: 'Comma-separated document types whose post-reindex count check should be skipped (reindex still runs). Use when the seed dataset has 0 records for a type. Example: ''PickupLocation'' or ''PickupLocation,ContentFile''.'
        required: false
        default: ''
        type: string
      testSuites:
        description: 'Comma-separated list of suites to run. Any subset of: graphql, restapi, e2e'
        required: false
        default: 'graphql,restapi,e2e'
        type: string
      vctestingPath:
        description: 'UI tests path'
        required: false
        type: string
        default: 'vc-testing-module'
      vctestingRepo:
        description: 'UI tests repository'
        required: false
        type: string
        default: 'VirtoCommerce/vc-testing-module'
      vctestingRepoBranch:
        description: 'UI tests repository branch'
        required: false
        type: string
        default: 'dev'

    secrets:
      envPAT:
        required: true
      sendgridApiKey:
        required: true
      testSecretEnvFile:
        required: true
      appInsightsInstrumentationKey:
        description: 'Application Insights instrumentation key (GUID). Passed to the platform container so its telemetry lands in the configured Application Insights resource.'
        required: false

jobs:
  # The matrix is a union, not a cross product: one job per database (engine auto-resolved),
  # plus one postgres job per extra engine. GitHub can only express that via `include`, and
  # expressions cannot map an array of strings into include objects — hence this job.
  build-matrix:
    runs-on: ubuntu-22.04
    outputs:
      include: ${{ steps.build.outputs.include }}
    steps:
      - name: Build test matrix
        id: build
        shell: bash
        env:
          DATABASE_PROVIDERS: ${{ inputs.databaseProviders }}
          SEARCH_PROVIDERS: ${{ inputs.searchProviders }}
          CUSTOM_MODULE_ID: ${{ inputs.customModuleId }}
          CUSTOM_PACKAGES_JSON_URL: ${{ inputs.customPackagesJsonUrl }}
        run: |
          # The only place module ids map to engines — docker-env-full just takes what it is given.
          MAP='{"virtocommerce.elasticsearch8":"elasticsearch8",
                "virtocommerce.elasticsearch9":"elasticsearch9",
                "virtocommerce.opensearch":"opensearch"}'

          # A provider module under test names its own engine.
          primary=$(jq -rn --arg id "${CUSTOM_MODULE_ID,,}" --argjson map "$MAP" '$map[$id] // empty')

          # Otherwise take it from the modules the custom manifest installs.
          usable='[]'
          if [[ -n "$CUSTOM_PACKAGES_JSON_URL" ]]; then
            if manifest=$(curl -fsSL --retry 3 "$CUSTOM_PACKAGES_JSON_URL"); then
              found=$(jq -c --argjson map "$MAP" \
                '[.Sources[]? | (.Modules // [])[] | .Id | ascii_downcase | $map[.] // empty] | unique' <<<"$manifest")
              echo "Search provider modules in the manifest: $found"

              # ElasticSearch8 and ElasticSearch9 ship different majors of the same client
              # assembly and only one loads per process, so only the newest is testable.
              elastic=$(jq -c '[.[] | select(startswith("elasticsearch"))]
                               | sort_by(ltrimstr("elasticsearch") | tonumber)' <<<"$found")
              if [[ "$(jq length <<<"$elastic")" -gt 1 ]]; then
                echo "::warning title=Test matrix::Manifest installs several Elasticsearch modules ($(jq -r 'join(", ")' <<<"$elastic")); only $(jq -r 'last' <<<"$elastic") can load, so the others are skipped."
              fi
              # Usable engines: newest Elasticsearch (if any) plus OpenSearch (separate client).
              usable=$(jq -c --argjson e "$elastic" '($e | if length > 0 then [last] else [] end)
                               + [.[] | select(. == "opensearch")]' <<<"$found")
            else
              echo "::warning title=Test matrix::Could not read $CUSTOM_PACKAGES_JSON_URL; assuming the default engine."
            fi
          fi

          [[ -z "$primary" ]] && primary=$(jq -r '.[0] // "elasticsearch8"' <<<"$usable")

          # Extra engines get one postgres job each; the database jobs already cover the primary.
          extras="$SEARCH_PROVIDERS"
          [[ "$(jq length <<<"$extras")" -eq 0 ]] && extras="$usable"
          extras=$(jq -c --arg p "$primary" '[.[] | select(. != $p)]' <<<"$extras")
          echo "Primary engine: $primary; extra jobs for: $extras"

          include=$(jq -cn --argjson dbs "$DATABASE_PROVIDERS" --arg primary "$primary" --argjson extras "$extras" \
            '[$dbs[] | {databaseProvider: ., searchProvider: $primary}]
             + [$extras[] | {databaseProvider: "postgres", searchProvider: .}]')
          echo "include=$include" >> "$GITHUB_OUTPUT"
          echo "::notice title=Test matrix::$(jq -r 'length' <<<"$include") job(s)"
          jq . <<<"$include"

  auto-autotests:
    needs: build-matrix
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build-matrix.outputs.include) }}

    env:
      GITHUB_TOKEN: ${{ secrets.envPAT }}

    steps:
    - name: Install VirtoCommerce.GlobalTool
      uses: VirtoCommerce/vc-github-actions/setup-vcbuild@master

    - name: Docker Env Full
      id: docker-env
      uses: VirtoCommerce/vc-github-actions/docker-env-full@VCST-5146 #master
      with:
        frontendZipUrl: ${{ inputs.frontendZipUrl }}
        installModules: ${{ inputs.installModules }}
        installCustomModule: ${{ inputs.installCustomModule }}
        platformDockerTag: ${{ inputs.platformDockerTag }}
        requiredModulesListUrl: ${{ inputs.requiredModulesListUrl }}
        testSecretEnvFile: ${{ secrets.testSecretEnvFile }}
        customPackagesJsonUrl: ${{ inputs.customPackagesJsonUrl }}
        customModuleId: ${{ inputs.customModuleId }}
        customModuleUrl: ${{ inputs.customModuleUrl }}
        sendgridApiKey: ${{ secrets.sendgridApiKey }}
        databaseProvider: ${{ matrix.databaseProvider }}
        searchProvider: ${{ matrix.searchProvider }}
        searchEngineVersion: ${{ inputs.searchEngineVersion }}
        prebuiltImageArtifact: ${{ inputs.prebuiltImageArtifact }}
        appInsightsInstrumentationKey: ${{ secrets.appInsightsInstrumentationKey }}

    - name: Run Auto Tests
      uses: VirtoCommerce/vc-github-actions/run-pytest-tests@master
      with:
        adminPassword: ${{ inputs.adminPassword }}
        adminUsername: ${{ inputs.adminUsername }}
        apiKey: ${{ inputs.apiKey }}
        backUrl: ${{ inputs.backUrl }}
        baseUrl: ${{ inputs.baseUrl }}
        browser: ${{ inputs.browser }}
        pytestMarkers: ${{ inputs.pytestMarkers }}
        testSecretEnvFile: ${{ secrets.testSecretEnvFile }}
        testSuites: ${{ inputs.testSuites }}
        vctestingPath: ${{ inputs.vctestingPath }}
        vctestingRepo: ${{ inputs.vctestingRepo }}
        vctestingRepoBranch: ${{ inputs.vctestingRepoBranch }}
        # Engine included so one run can cover several database/engine combinations without
        # the uploads colliding. searchProvider is resolved inside docker-env-full, so it is
        # read back from that step's output rather than from inputs.
        artifactSuffix: -${{ matrix.databaseProvider }}-${{ steps.docker-env.outputs.searchProvider }}
        skipDocCountVerification: ${{ inputs.skipDocCountVerification }}