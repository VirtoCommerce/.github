# v3.800.43
# https://virtocommerce.atlassian.net/browse/VCST-5146
name: Auto tests

on:
  workflow_call:
    inputs:
      adminPassword:
        description: 'Admin Password'
        required: false
        type: string
        default: ''
      adminUsername:
        description: 'Admin Username'
        required: false
        type: string
        default: 'admin'
      apiKey:
        description: 'API Key'
        required: false
        type: string
        default: ''
      backUrl:
        description: 'Back URL'
        required: false
        type: string
        default: 'http://localhost:8090'
      baseUrl:
        description: 'Base URL'
        required: false
        type: string
        default: 'http://localhost'
      browser:
        required: false
        type: string
        default: 'chromium'
      customModuleId:
        description: 'Custom Module id'
        required: false
        type: string
        default: ''
      customModuleUrl:
        description: 'Custom module Module url'
        required: false
        type: string
        default: ''
      customPackagesJsonUrl:
        description: 'Custom packages.json url'
        required: false
        type: string
        default: ''
      databaseProviders:
        description: 'JSON array of database providers to run the test matrix against. Any subset of: sqlserver, mysql, postgres'
        required: false
        type: string
        default: '["sqlserver","mysql","postgres"]'
      frontendZipUrl:
        required: false
        type: string
        default: 'latest'
      installCustomModule:
        description: 'Enable or disable "Install Custom Modules" step'
        required: false
        type: string
        default: 'false'
      installModules:
        description: 'Enable or disable "Install Modules" step'
        required: false
        type: string
        default: 'true'
      moduleDependencies:
        description: 'JSON array of module ids the module under test depends on, as declared in its module.manifest. Only used to pick the search engine: a dependency on a provider module is what makes the matrix run against that engine. The module-CI path supplies it from the checkout it already has, because there it is the only manifest naming the engine. Unlike the module lists behind customPackagesJsonUrl / requiredModulesListUrl, carrying no provider here is normal and never fails the run.'
        required: false
        type: string
        default: '[]'
      platformDockerTag:
        description: 'Platform docker tag'
        required: false
        type: string
        default: 'local-latest'
      prebuiltImageArtifact:
        description: 'Name of a workflow artifact containing a docker save tar of the platform image. When set, the action downloads and loads it instead of building or pulling, and installModules / installCustomModule / customPackagesJsonUrl must be unset.'
        required: false
        type: string
        default: ''
      pytestMarkers:
        description: 'Additional pytest -m marker expression, AND-combined with each suite''s default markers. Leave empty to use defaults only.'
        required: false
        default: ''
        type: string
      requiredModulesListUrl:
        description: 'The URL of the JSON file with the required modules list'
        required: false
        type: string
        default: ''
      searchProviders:
        description: 'JSON array of search engines to run the test matrix against. Any subset of: elasticsearch8, elasticsearch9, opensearch. Crosses with databaseProviders: every engine gets the full database matrix, so two engines over the default three databases is six jobs. Empty (the default) derives the list from the caller''s manifests instead: every search provider module they install is covered, except that only the newest Elasticsearch is kept when several are installed (ES8 + ES9 + OpenSearch gives elasticsearch9 and opensearch). With no engine module in the manifests it falls back to the engine of customModuleId when that is a provider module, else elasticsearch8. The platform image must ship the module for every engine listed.'
        required: false
        type: string
        default: '[]'
      skipDocCountVerification:
        description: 'Comma-separated document types whose post-reindex count check should be skipped (reindex still runs). Use when the seed dataset has 0 records for a type. Example: ''PickupLocation'' or ''PickupLocation,ContentFile''.'
        required: false
        default: ''
        type: string
      testSuites:
        description: 'Comma-separated list of suites to run. Any subset of: graphql, restapi, e2e'
        required: false
        default: 'graphql,restapi,e2e'
        type: string
      vctestingPath:
        description: 'UI tests path'
        required: false
        type: string
        default: 'vc-testing-module'
      vctestingRepo:
        description: 'UI tests repository'
        required: false
        type: string
        default: 'VirtoCommerce/vc-testing-module'
      vctestingRepoBranch:
        description: 'UI tests repository branch'
        required: false
        type: string
        default: 'dev'

    secrets:
      envPAT:
        required: true
      sendgridApiKey:
        required: true
      testSecretEnvFile:
        required: true
      appInsightsInstrumentationKey:
        description: 'Application Insights instrumentation key (GUID). Passed to the platform container so its telemetry lands in the configured Application Insights resource.'
        required: false

jobs:
  # Databases x engines, and the engines are only known once the manifests are fetched —
  # expressions can do neither.
  build-matrix:
    runs-on: ubuntu-22.04
    outputs:
      include: ${{ steps.build.outputs.include }}
    steps:
      # Split from the rules below so a bad manifest is visible on its own.
      - name: Read the modules the manifests install
        id: manifests
        shell: bash
        env:
          CUSTOM_PACKAGES_JSON_URL: ${{ inputs.customPackagesJsonUrl }}
          REQUIRED_MODULES_LIST_URL: ${{ inputs.requiredModulesListUrl }}
        run: |
          # Lowercased module ids from either manifest shape: .Sources[].Modules[] or a flat [{Id,Version}]
          ids='[]'
          for url in "$CUSTOM_PACKAGES_JSON_URL" "$REQUIRED_MODULES_LIST_URL"; do
            [[ -z "$url" ]] && continue
            # A 2xx can still carry a sign-in page, so error() on an unknown shape tells
            # "not a manifest" from "no modules in it". Nothing read -> the default engine.
            if body=$(curl -fsSL --retry 3 "$url") &&
               found=$(jq -c 'if (type == "object" and has("Sources")) or type == "array" then
                                [((objects | .Sources[]?.Modules[]?), (arrays | .[]))
                                 | .Id? // empty | strings | ascii_downcase]
                              else error("unknown manifest shape") end' <<<"$body" 2>/dev/null) &&
               [[ -n "$found" ]]; then # jq exits 0 on an empty body
              ids=$(jq -cn --argjson a "$ids" --argjson b "$found" '$a + $b | unique')
            else
              echo "::warning title=Test matrix::Could not read a module list from $url; it does not take part in picking the search engine."
            fi
          done
          echo "Modules installed by the manifests: $(jq -r 'length' <<<"$ids")"
          echo "ids=$ids" >> "$GITHUB_OUTPUT"

      - name: Build test matrix
        id: build
        shell: pwsh
        env:
          DATABASE_PROVIDERS: ${{ inputs.databaseProviders }}
          SEARCH_PROVIDERS: ${{ inputs.searchProviders }}
          CUSTOM_MODULE_ID: ${{ inputs.customModuleId }}
          MODULE_IDS: ${{ steps.manifests.outputs.ids }}
          DEPENDENCY_IDS: ${{ inputs.moduleDependencies }}
        run: |
          # Map module id to the search provider
          $engines = [ordered]@{
            'virtocommerce.elasticsearch8' = 'elasticsearch8'
            'virtocommerce.elasticsearch9' = 'elasticsearch9'
            'virtocommerce.opensearch'     = 'opensearch'
          }

          function Fail($message) {
            Write-Host "::error title=Test matrix::$message"
            exit 1
          }

          # Checked, not coerced: an object would otherwise reach some later message as a
          # stringified PSCustomObject. -NoEnumerate, or a one-item array arrives as a scalar.
          function Read-JsonArray($raw, $name) {
            if ([string]::IsNullOrWhiteSpace($raw)) { return @() }
            try { $parsed = ConvertFrom-Json -InputObject $raw -NoEnumerate }
            catch { Fail "$name must be a JSON array, got '$raw'." }
            if ($parsed -isnot [array]) { Fail "$name must be a JSON array, got '$raw'." }
            @($parsed)
          }

          # ES8 and ES9 ship different majors of one client assembly; only the newest loads
          function Select-Usable($installed) {
            $es = @($installed | Where-Object { $_.StartsWith('elasticsearch') } |
                    Sort-Object { [int]($_ -replace '^elasticsearch') })
            if ($es.Count -gt 1) {
              Write-Host "::warning title=Test matrix::Several Elasticsearch modules are in play ($($es -join ', ')); only $($es[-1]) can load, so the others are skipped."
            }
            @($es | Select-Object -Last 1) + @($installed | Where-Object { $_ -eq 'opensearch' })
          }

          # Manifests say what is installed, the module under test says what it needs;
          # only the manifests can fail the run below.
          $manifestIds = Read-JsonArray $env:MODULE_IDS 'The module list read from the manifests'
          $dependencyIds = @(Read-JsonArray $env:DEPENDENCY_IDS 'moduleDependencies' |
                             ForEach-Object { "$_".ToLowerInvariant() })
          $installed = @($manifestIds + $dependencyIds | ForEach-Object { $engines[$_] } |
                         Where-Object { $_ } | Sort-Object -Unique)
          $usable = Select-Usable $installed

          # Module under test names its engine; else the manifests, else default
          $ownEngine = $engines["$env:CUSTOM_MODULE_ID".ToLowerInvariant()]
          if (-not $ownEngine -and $installed.Count -eq 0 -and $manifestIds.Count -gt 0) {
            # Fail now, not minutes into every database job
            Fail 'The manifests install no search provider this workflow can run.'
          }

          $requested = Read-JsonArray $env:SEARCH_PROVIDERS 'searchProviders'
          $unknown = @($requested | Where-Object { $_ -notin $engines.Values })
          if ($unknown.Count -gt 0) {
            Fail "Unknown searchProviders entries: $($unknown -join ', '). Allowed values: $($engines.Values -join ', ')."
          }

          # Explicit searchProviders wins; a provider module under test is always covered.
          $wanted = if ($requested.Count -gt 0) { $requested } else { $usable }
          $wanted = @(@($ownEngine) + $wanted | Where-Object { $_ } | Select-Object -Unique)
          if ($wanted.Count -eq 0) { $wanted = @('elasticsearch8') }

          # Full database matrix per engine: the engine is what the whole suite runs against,
          # not a variation of one job.
          $databases = Read-JsonArray $env:DATABASE_PROVIDERS 'databaseProviders'
          if ($databases.Count -eq 0) {
            # An empty include writes nothing, and fromJSON('') is a workflow-level parse error
            Fail 'databaseProviders is empty, so the matrix would hold no jobs at all.'
          }

          $include = @(foreach ($engine in $wanted) {
            foreach ($database in $databases) {
              [ordered]@{ databaseProvider = $database; searchProvider = $engine }
            }
          })

          Write-Host "Engines: $($wanted -join ', '); databases: $($databases -join ', ')"
          Write-Host "::notice title=Test matrix::$($include.Count) job(s)"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "include=$($include | ConvertTo-Json -Depth 5 -Compress -AsArray)"
          $include | ConvertTo-Json -Depth 5

  auto-autotests:
    needs: build-matrix
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build-matrix.outputs.include) }}

    env:
      GITHUB_TOKEN: ${{ secrets.envPAT }}

    steps:
    - name: Install VirtoCommerce.GlobalTool
      uses: VirtoCommerce/vc-github-actions/setup-vcbuild@master

    - name: Docker Env Full
      uses: VirtoCommerce/vc-github-actions/docker-env-full@master
      with:
        frontendZipUrl: ${{ inputs.frontendZipUrl }}
        installModules: ${{ inputs.installModules }}
        installCustomModule: ${{ inputs.installCustomModule }}
        platformDockerTag: ${{ inputs.platformDockerTag }}
        requiredModulesListUrl: ${{ inputs.requiredModulesListUrl }}
        testSecretEnvFile: ${{ secrets.testSecretEnvFile }}
        customPackagesJsonUrl: ${{ inputs.customPackagesJsonUrl }}
        customModuleId: ${{ inputs.customModuleId }}
        customModuleUrl: ${{ inputs.customModuleUrl }}
        sendgridApiKey: ${{ secrets.sendgridApiKey }}
        databaseProvider: ${{ matrix.databaseProvider }}
        searchProvider: ${{ matrix.searchProvider }}
        prebuiltImageArtifact: ${{ inputs.prebuiltImageArtifact }}
        appInsightsInstrumentationKey: ${{ secrets.appInsightsInstrumentationKey }}

    - name: Run Auto Tests
      uses: VirtoCommerce/vc-github-actions/run-pytest-tests@master
      with:
        adminPassword: ${{ inputs.adminPassword }}
        adminUsername: ${{ inputs.adminUsername }}
        apiKey: ${{ inputs.apiKey }}
        backUrl: ${{ inputs.backUrl }}
        baseUrl: ${{ inputs.baseUrl }}
        browser: ${{ inputs.browser }}
        pytestMarkers: ${{ inputs.pytestMarkers }}
        testSecretEnvFile: ${{ secrets.testSecretEnvFile }}
        testSuites: ${{ inputs.testSuites }}
        vctestingPath: ${{ inputs.vctestingPath }}
        vctestingRepo: ${{ inputs.vctestingRepo }}
        vctestingRepoBranch: ${{ inputs.vctestingRepoBranch }}
        artifactSuffix: -${{ matrix.databaseProvider }}-${{ matrix.searchProvider }}
        skipDocCountVerification: ${{ inputs.skipDocCountVerification }}
