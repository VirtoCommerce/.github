# https://virtocommerce.atlassian.net/browse/VCST-6969
name: Platform base image

# Rebuilds ghcr.io/virtocommerce/platform-base (actions/docker-env-full/base-image/), the base
# of the platform image that docker-env and docker-env-full build for module CI. The rebuild
# picks up the current aspnet:10.0 patch and Ubuntu security updates.
#
# Both actions default to the floating 10.0-wkhtmltopdf tag, so moving it changes every
# module's CI at once, with no release. That is why a build first goes out under a dated tag
# only, is smoke-tested and run through the Playwright auto-tests (vc-module-catalog's latest
# release on the latest bundle, all three databases), and only then gets the floating tag.
# A failed test leaves the floating tag on the previous image; rerun the failed jobs to retry.
#
# Prerequisite: the platform-base package grants this repository Write access (package
# settings > Manage Actions access).

on:
  schedule:
    - cron: '0 6 1 * *' # 1st of the month, 06:00 UTC
  push:
    branches: [main]
    paths:
      - 'actions/docker-env-full/base-image/**'
  workflow_dispatch:
    inputs:
      promote:
        description: 'Move the floating tag to the new build once the tests pass (off: dated tag and tests only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: platform-base-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/virtocommerce/platform-base
  # The floating tag, and the prefix of the dated ones: <TAG>-<yyyymmdd>-<run>.
  TAG: 10.0-wkhtmltopdf
  ASPNET: mcr.microsoft.com/dotnet/aspnet:10.0
  # vc-docker's platform image is built from this branch; wait-for-it.sh comes from it.
  VC_DOCKER_BRANCH: feat/net10
  # The module the auto-tests install on top of the latest bundle, from its latest release.
  TEST_MODULE_REPO: VirtoCommerce/vc-module-catalog

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
      dated-tag: ${{ steps.src.outputs.dated-tag }}
      test-module-url: ${{ steps.src.outputs.test-module-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve sources
        id: src
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # wait-for-it.sh is gitignored here: take vc-docker's copy, by commit, so the label
          # below says exactly which one is inside.
          vc_docker_sha=$(gh api "repos/VirtoCommerce/vc-docker/commits/$VC_DOCKER_BRANCH" --jq .sha)
          curl -fsSL -o actions/docker-env-full/base-image/wait-for-it.sh \
            "https://raw.githubusercontent.com/VirtoCommerce/vc-docker/$vc_docker_sha/linux/platform/wait-for-it.sh"
          # Current patch of aspnet:10.0, recorded by digest so the build is reproducible.
          docker pull --quiet "$ASPNET"
          aspnet=$(docker inspect --format '{{index .RepoDigests 0}}' "$ASPNET")
          test_module_url=$(gh api "repos/$TEST_MODULE_REPO/releases/latest" \
            --jq '[.assets[] | select(.name | endswith(".zip")) | .browser_download_url][0] // empty')
          if [ -z "$test_module_url" ]; then
            echo "::error::No .zip asset in the latest release of $TEST_MODULE_REPO"
            exit 1
          fi
          dated_tag="$TAG-$(date -u +%Y%m%d)-$GITHUB_RUN_NUMBER"
          {
            echo "vc-docker-sha=$vc_docker_sha"
            echo "aspnet=$aspnet"
            echo "dated-tag=$dated_tag"
            echo "test-module-url=$test_module_url"
          } >> "$GITHUB_OUTPUT"
          echo "vc-docker $VC_DOCKER_BRANCH: $vc_docker_sha"
          echo "aspnet: $aspnet"
          echo "test module: $test_module_url"

      - name: Build
        env:
          ASPNET_IMAGE: ${{ steps.src.outputs.aspnet }}
          VC_DOCKER_SHA: ${{ steps.src.outputs.vc-docker-sha }}
          DATED_TAG: ${{ steps.src.outputs.dated-tag }}
        run: |
          docker build \
            --build-arg "ASPNET_IMAGE=$ASPNET_IMAGE" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.base.name=$ASPNET_IMAGE" \
            --label "com.virtocommerce.vc-docker.revision=$VC_DOCKER_SHA" \
            --tag "$IMAGE:$DATED_TAG" \
            actions/docker-env-full/base-image

      - name: Smoke test
        id: smoke
        env:
          DATED_TAG: ${{ steps.src.outputs.dated-tag }}
        run: |
          # What Dockerfile.platform and the compose files rely on: wkhtmltopdf for PDF
          # generation, an executable /wait-for-it.sh as the entrypoint, the ASP.NET runtime.
          docker run --rm --entrypoint sh "$IMAGE:$DATED_TAG" -c \
            'wkhtmltopdf --version && test -x /wait-for-it.sh && dotnet --list-runtimes'
          runtime=$(docker run --rm --entrypoint sh "$IMAGE:$DATED_TAG" -c \
            'dotnet --list-runtimes | grep Microsoft.AspNetCore.App | cut -d" " -f2')
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
          echo "ASP.NET Core runtime: $runtime"

      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The dated tag only: nothing uses it until the tests below pass and the floating tag
      # is moved to it.
      - name: Push the dated tag
        id: push
        env:
          DATED_TAG: ${{ steps.src.outputs.dated-tag }}
        run: |
          docker push --quiet "$IMAGE:$DATED_TAG"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$DATED_TAG" | cut -d@ -f2)
          {
            echo "digest=$digest"
            echo "image=$IMAGE:$DATED_TAG@$digest"
          } >> "$GITHUB_OUTPUT"
          echo "Pushed $IMAGE:$DATED_TAG, digest $digest"

      - name: Summary
        if: always()
        env:
          ASPNET_IMAGE: ${{ steps.src.outputs.aspnet }}
          VC_DOCKER_SHA: ${{ steps.src.outputs.vc-docker-sha }}
          DATED_TAG: ${{ steps.src.outputs.dated-tag }}
          RUNTIME: ${{ steps.smoke.outputs.runtime }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Platform base image"
            echo "- Base: \`$ASPNET_IMAGE\`"
            echo "- ASP.NET Core runtime: \`$RUNTIME\`"
            echo "- wait-for-it.sh from vc-docker \`$VC_DOCKER_SHA\`"
            if [ -n "$DIGEST" ]; then
              echo "- Pushed \`$IMAGE:$DATED_TAG\`: \`$DIGEST\`"
            else
              echo "- Not pushed"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The same reusable workflow modules run as auto-tests, at this commit, with the new build as
  # the base: the platform image is built FROM it exactly as in module CI.
  test:
    needs: build
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/playwright-tests.yml
    with:
      installModules: 'false'
      installCustomModule: 'true'
      customModuleId: VirtoCommerce.Catalog
      customModuleUrl: ${{ needs.build.outputs.test-module-url }}
      platformBaseImage: ${{ needs.build.outputs.image }}
    secrets:
      appInsightsInstrumentationKey: ${{ secrets.E2E_APPINSIGHTSINSTRUMENTATIONKEY }}
      envPAT: ${{ secrets.REPO_TOKEN }}
      testSecretEnvFile: ${{ secrets.VC_TESTING_MODULE_ENV_FILE }}
      sendgridApiKey: ${{ secrets.SENDGRID_APIKEY_4E2E_AUTOTESTS }}

  promote:
    needs: [build, test]
    if: github.event_name != 'workflow_dispatch' || inputs.promote
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Points the floating tag at the tested manifest; nothing is rebuilt or re-pushed.
      - name: Move the floating tag
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          DATED_TAG: ${{ needs.build.outputs.dated-tag }}
        run: |
          previous=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest.Digest}}' | tr -d '"' || true)
          docker buildx imagetools create --tag "$IMAGE:$TAG" "$IMAGE@$DIGEST"
          {
            echo "### Floating tag moved"
            echo "- \`$IMAGE:$TAG\` → \`$DATED_TAG\` (\`$DIGEST\`)"
            echo "- Previous: \`${previous:-none}\`; to roll back: \`docker buildx imagetools create --tag $IMAGE:$TAG $IMAGE@${previous:-<digest>}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$IMAGE:$TAG -> $DATED_TAG ($DIGEST), previous $previous"
