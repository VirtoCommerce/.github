name: Publish npm modules
on:
    workflow_dispatch:
    push:
        branches: [ main ]
        paths:
            - 'actions/vc-actions-lib/**'

permissions:
    contents: read

jobs:
    publish:
        runs-on: ubuntu-latest
        # Trusted publishing: npm swaps the GitHub OIDC token for a short-lived publish
        # credential (and adds provenance). The trusted publisher on npmjs.com is tied to
        # this repo and this file name, so renaming the file breaks publishing.
        permissions:
            contents: read
            id-token: write

        steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            persist-credentials: false

        - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
          with:
            # Was Node 12 (EOL, npm 6). No lifecycle scripts run and npm never
            # packs package-lock.json, so the payload is identical -- verified
            # against the 1.2.16 tarball.
            # No registry-url: it writes an .npmrc with a token placeholder, and trusted
            # publishing needs no token. npmjs.org is the default registry.
            node-version-file: actions/.nvmrc

        - name: Publish vc-actions-lib
          working-directory: ./actions/vc-actions-lib
          run: |
            # Trusted publishing needs npm 11.5.1 or later.
            npm_version=$(npm --version)
            if [ "$(printf '%s\n' 11.5.1 "$npm_version" | sort -V | head -n1)" != 11.5.1 ]; then
              echo "::error::npm $npm_version is too old for trusted publishing (needs 11.5.1+)."
              exit 1
            fi

            name=$(node -p "require('./package.json').name")
            version=$(node -p "require('./package.json').version")

            # main publishes latest; any other branch publishes next. npm
            # prefers the latest-tagged version whenever it satisfies the
            # requested range, so consumers stay put until this is merged.
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              tag=latest
            else
              tag=next
            fi

            if ! npm view "$name@$version" version >/dev/null 2>&1; then
              echo "Publishing $name@$version under tag '$tag'."
              npm publish --access public --tag "$tag"
            elif [ "$tag" = latest ]; then
              # Pre-released from a branch dispatch. npm refuses to republish an
              # existing version, and trusted publishing covers `npm publish` only,
              # so the promotion to latest is a manual step for a maintainer.
              current=$(npm view "$name" dist-tags.latest)
              if [ "$current" = "$version" ]; then
                echo "::notice::$name@$version is already latest; nothing to do."
              else
                echo "::warning::$name@$version is published but not latest (latest is $current). Promote it by hand: npm dist-tag add $name@$version latest"
              fi
            else
              echo "::notice::$name@$version already published under '$tag'; nothing to do."
            fi
