name: Auto-maintain workflows, templates and actions (zizmor security autofixes)

# Pin bumps are Dependabot's job (see .github/dependabot.yml).

on:
  schedule:
    - cron: '0 8 * * 1' # Monday 08:00 UTC
  workflow_dispatch:

# GITHUB_TOKEN only reads: checkout and zizmor's tag lookups. The PR is pushed
# and opened with REPO_TOKEN (see "Open PR with updates").
permissions:
  contents: read

jobs:
  zizmor-autofix:
    runs-on: ubuntu-latest
    env:
      ZIZMOR_VERSION: 1.25.2
      # Without a token zizmor's tag lookups hit the 60/hour unauthenticated limit.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Apply zizmor security autofixes
        shell: bash
        # GITHUB_TOKEN lets zizmor resolve SHAs->tags (ref-version-mismatch);
        # zizmor.yml scopes unpinned-uses. --fix=all applies safe+unsafe fixes —
        # this PR reviews the unsafe ones. Collection must match workflow-security.yml
        # (templates as explicit globs, `.` for actions) or the fixer skips what the
        # gate flags. Exit codes: 0 = clean; 11-14 = ran OK but findings remain
        # (info/low/medium/high by max severity) — expected, the unsafe/unfixable
        # ones await review in this PR. Any other non-zero (1/2 usage, install/
        # crash) means it didn't really run — fail rather than open a misleading
        # PR. `|| rc=$?` captures the code under the shell's `set -e`.
        run: |
          shopt -s nullglob
          rc=0
          pipx run --spec "zizmor==$ZIZMOR_VERSION" zizmor --fix=all \
            --collect=workflows,actions . workflow-templates/*.yml workflow-templates/*.yaml || rc=$?
          if [ "$rc" -ne 0 ] && { [ "$rc" -lt 11 ] || [ "$rc" -gt 14 ]; }; then
            echo "::error::zizmor failed to run (exit $rc), not just remaining findings"
            exit "$rc"
          fi
          echo "zizmor completed (exit $rc)."

      - name: Open PR with updates
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # Needs a PAT with `workflow` scope: this job edits .github/workflows/,
          # and GitHub blocks the default GITHUB_TOKEN from pushing workflow files
          # (the `permissions:` block can't grant this).
          token: ${{ secrets.REPO_TOKEN }}
          commit-message: "ci: Auto-maintain workflows (zizmor security autofixes)"
          title: "ci: Auto-maintain workflows (zizmor security autofixes)"
          branch: ci/auto-maintain-workflows
          delete-branch: true
          # Request a review so the maintenance PR notifies a human (must not be
          # the REPO_TOKEN owner, or GitHub silently drops the self-request).
          reviewers: AndrewEhlo
          body: |
            Automated security autofixes for GitHub Actions workflows:
            `zizmor --fix=all` applies safe **and unsafe** fixes (e.g.
            `template-injection`, `artipacked`, `ref-version-mismatch`) across
            `.github/workflows/`, `workflow-templates/` and the composite
            actions in `actions/`, since the reusable workflows and actions here
            are consumed by other repos and the templates are copied into
            modules.

            Pin bumps are not part of this PR: Dependabot opens those.

            > [!WARNING]
            > `--fix=all` includes **unsafe** fixes that require human review.
            > In particular, check `artipacked` changes (`persist-credentials:
            > false`) on any workflow that later pushes with the checkout token,
            > and verify `template-injection` rewrites preserve intended values.
