# v3.1000.6
# https://virtocommerce.atlassian.net/browse/VCI-1445
name: VC unit test and sonar scan

on:
  workflow_call:
    secrets:
      sonarToken:
        required: true

jobs:
  test-and-sonar:
    runs-on: ubuntu-24.04
    env:
      SONAR_TOKEN: ${{ secrets.sonarToken }}
      MSBuildEnableWorkloadResolver: 'false'
  
    steps: 

    - name: Set up Node 24
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'

    - name: Set up Java 17
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install VirtoCommerce.GlobalTool
      uses: VirtoCommerce/.github/actions/setup-vcbuild@v3.1000.6
    
    - name: Install dotnet-sonarscanner
      run: dotnet tool install --global dotnet-sonarscanner

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Get Artifact Version
      uses: VirtoCommerce/.github/actions/get-image-version@v3.1000.6
      id: artifactVer

    - name: Set VERSION_SUFFIX variables
      run: |
          echo "VERSION_SUFFIX=${STEPS_ARTIFACTVER_OUTPUTS_SUFFIX}" >> $GITHUB_ENV
      env:
        STEPS_ARTIFACTVER_OUTPUTS_SUFFIX: ${{ steps.artifactVer.outputs.suffix }}
 
    - name: Add version suffix
      if: ${{ github.ref != 'refs/heads/master' || github.ref != 'refs/heads/main' }}
      uses: VirtoCommerce/.github/actions/add-version-suffix@v3.1000.6
      with:
        versionSuffix: ${{ env.VERSION_SUFFIX }}


    - name: SonarCloud Begin
      uses: VirtoCommerce/.github/actions/sonar-scanner-begin@v3.1000.6

    - name: Build
      run: vc-build Compile

    - name: Unit Tests
      run: vc-build Test -skip

    - name: SonarCloud End
      uses: VirtoCommerce/.github/actions/sonar-scanner-end@v3.1000.6

    - name: Quality Gate
      uses: VirtoCommerce/.github/actions/sonar-quality-gate@v3.1000.6
      with:
        login: ${{ env.SONAR_TOKEN }}
