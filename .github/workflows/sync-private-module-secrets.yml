name: Sync private module secrets
run-name: "Sync private module secrets: ${{ inputs.repos || 'all of private-module-repos.json' }}${{ inputs.dryRun && ' (dry run)' || '' }}"

# On GitHub Free, org secrets are not visible to private repositories, so each private module
# holds its own copies. This workflow overwrites those copies with the current org values, the
# same way create-module-repository.yml seeds a new private repo. Run it after rotating an org
# secret, or when a private module's copy has expired.
on:
  workflow_dispatch:
    inputs:
      repos:
        description: 'Comma-separated repos to sync (default: all of private-module-repos.json). Each must be in private-module-repos.json.'
        required: false
        type: string
      dryRun:
        description: 'Only list the repositories, do not write secrets'
        required: false
        type: boolean
        default: true

concurrency:
  group: sync-private-module-secrets
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    # Requires manual approval; holds MODULE_REPO_MGMT_TOKEN, which can write repository secrets.
    environment: module-repository-management
    env:
      GH_TOKEN: ${{ secrets.MODULE_REPO_MGMT_TOKEN }}
      ORG_NAME: ${{ github.repository_owner }}
      REPOS_INPUT: ${{ inputs.repos }}
      DRY_RUN: ${{ inputs.dryRun }}
      REPO_TOKEN_VALUE: ${{ secrets.REPO_TOKEN }}
      BLOB_TOKEN_VALUE: ${{ secrets.BLOB_TOKEN }}
    steps:
      # private-module-repos.json is the list of private modules that hold copies of the org
      # secrets: every private repo that publishes NuGet packages, plus each private repo
      # create-module-repository.yml creates.
      - name: Checkout .github
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: private-module-repos.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Copy org secrets into private module repositories
        run: |
          declare -A SECRETS=([REPO_TOKEN]="$REPO_TOKEN_VALUE" [BLOB_TOKEN]="$BLOB_TOKEN_VALUE")
          for NAME in "${!SECRETS[@]}"; do
            if [ -z "${SECRETS[$NAME]}" ]; then
              echo "::error::Org secret $NAME is not available to this workflow."
              exit 1
            fi
          done

          # Fail loudly on a malformed or empty list rather than syncing nothing.
          REPOS=$(jq -c 'if type == "array" and length > 0 then . else error("private-module-repos.json must be a non-empty array") end' private-module-repos.json)
          # Optional subset. Only repos from the list, so a typo can't write secrets elsewhere.
          if [ -n "${REPOS_INPUT// /}" ]; then
            REPOS=$(jq -c --arg want "$REPOS_INPUT" '
              ($want | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(. != ""))) as $w
              | ($w - .) as $unknown
              | if ($unknown | length) > 0 then error("not in private-module-repos.json: \($unknown | join(", "))") else $w end' <<<"$REPOS")
          fi

          {
            echo "### Sync private module secrets"
            echo "Secrets: \`${!SECRETS[*]}\`"
            [ "$DRY_RUN" = "true" ] && echo "**Dry run** — nothing was written."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          FAILED=0
          for REPO in $(jq -r '.[]' <<<"$REPOS"); do
            # A public repo reads the org secrets directly; a repo-level copy would only shadow them.
            VISIBILITY=$(gh api "repos/$ORG_NAME/$REPO" --jq '.visibility' 2>/dev/null || echo "missing")
            if [ "$VISIBILITY" != "private" ]; then
              echo "::warning::$ORG_NAME/$REPO is $VISIBILITY — skipped. Remove it from private-module-repos.json."
              echo "- \`$REPO\`: skipped ($VISIBILITY)" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            if [ "$DRY_RUN" = "true" ]; then
              echo "Would sync $ORG_NAME/$REPO"
              echo "- \`$REPO\`: would sync" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            REPO_FAILED=0
            for NAME in "${!SECRETS[@]}"; do
              # Value on stdin, not in the command line.
              if ! printf '%s' "${SECRETS[$NAME]}" | gh secret set "$NAME" --repo "$ORG_NAME/$REPO"; then
                echo "::error::Could not set $NAME in $ORG_NAME/$REPO."
                REPO_FAILED=1
              fi
            done
            if [ "$REPO_FAILED" -eq 0 ]; then
              echo "Synced $ORG_NAME/$REPO"
              echo "- \`$REPO\`: synced" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- \`$REPO\`: **failed**" >> "$GITHUB_STEP_SUMMARY"
              FAILED=$((FAILED + 1))
            fi
          done

          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED repositories failed."
            exit 1
          fi
