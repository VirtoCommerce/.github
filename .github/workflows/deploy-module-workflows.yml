name: Deploy Module workflows

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy'
        required: true
        type: string
        default: 'v3.1000.2'
      repos:
        description: 'Comma-separated repos to deploy to (default: all of module-repos.json). Each must be in module-repos.json.'
        required: false
        type: string
        default: ''
      dryRun:
        description: 'Show the changes per repo without committing or pushing'
        required: false
        type: boolean
        default: false

# Least privilege: pushes use the REPO_TOKEN PAT, so GITHUB_TOKEN needs only read.
permissions:
  contents: read

jobs:

  # module-repos.json is the one list of repos that get these templates; scripts
  # enforcing anything per-repo read the same file instead of globbing the org.
  list-repos:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.read.outputs.repos }}
    steps:
      - name: Checkout .github
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: module-repos.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Read the repo list
        id: read
        env:
          REPOS_INPUT: ${{ inputs.repos }}
        run: |
          # Compact, and fail loudly on a malformed or empty list rather than
          # producing an empty matrix that quietly deploys nothing.
          repos=$(jq -c 'if type == "array" and length > 0 then . else error("module-repos.json must be a non-empty array") end' module-repos.json)
          # Optional subset (e.g. to test on one module). Only repos from the list, so a typo
          # can't push templates to a repo that isn't a module.
          if [ -n "${REPOS_INPUT// /}" ]; then
            repos=$(jq -c --arg want "$REPOS_INPUT" '
              ($want | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(. != ""))) as $w
              | ($w - .) as $unknown
              | if ($unknown | length) > 0 then error("not in module-repos.json: \($unknown | join(", "))") else $w end' <<<"$repos")
          fi
          echo "Repos to deploy to: $(jq -r 'length' <<<"$repos")"
          echo "repos=$repos" >> "$GITHUB_OUTPUT"

  deploy:
    needs: list-repos
    runs-on: ubuntu-latest
    strategy:
      # Deploy each repo independently — one repo failing (e.g. archived) must
      # not cancel the others.
      fail-fast: false
      matrix:
        repoName: ${{ fromJSON(needs.list-repos.outputs.repos) }}

# Module samples workflows
        # include:
        # - deploymentFolder: modules-sample
        #   repoName: vc-module-order
        # - deploymentFolder: modules-sample
        #   repoName: vc-module-customer
        # - deploymentFolder: modules-sample
        #   repoName: vc-module-notification

    env:
      DEPLOY_REPO: ${{ github.repository_owner }}/${{ matrix.repoName }}
      TEMPLATE_REPO_FOLDER: 'main'
      TEMPLATES_LIST: 'release.yml publish-nugets.yml module-release-hotfix.yml module-ci.yml'
      WORKING_DIR: ${{ github.workspace }}
    steps:

    - name: Checkout .github
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.version }}
        path: ${{ env.TEMPLATE_REPO_FOLDER }}
        persist-credentials: false

    - name: Checkout ${{ env.DEPLOY_REPO }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ env.DEPLOY_REPO }}
        path: ${{ matrix.repoName }}
        token: ${{ secrets.REPO_TOKEN }}
        persist-credentials: false

    - name: Copy workflows
      working-directory: ${{ env.WORKING_DIR }}/${{ env.TEMPLATE_REPO_FOLDER }}/workflow-templates
      env:
        DEST_FOLDER: '${{ env.WORKING_DIR }}/${{ matrix.repoName }}/.github/workflows/'
      run: |
        cp ${{ env.TEMPLATES_LIST }} ${DEST_FOLDER}

    - name: Setup Git Credentials
      uses: VirtoCommerce/.github/actions/setup-git-credentials-github@v3.1000.2
      with: 
        githubToken: ${{ secrets.REPO_TOKEN }}

    - name: Commit changes to ${{ env.DEPLOY_REPO }}
      working-directory: ${{ matrix.repoName }}
      env:
        GH_TOKEN: ${{ secrets.REPO_TOKEN }}
        DRY_RUN: ${{ inputs.dryRun }}
      run: |
        # Skip archived repos (push is rejected) — DEPLOY_REPO comes from job env.
        if [ "$(gh api "repos/$DEPLOY_REPO" --jq '.archived')" = "true" ]; then
          echo "::warning::$DEPLOY_REPO is archived — skipping."
          exit 0
        fi
        git add .
        # Skip repos already up to date so a no-op doesn't fail the job.
        if git diff --cached --quiet; then
          echo "::warning::No changes for $DEPLOY_REPO — already up to date."
          exit 0
        fi
        if [ "$DRY_RUN" = "true" ]; then
          echo "::notice::Dry run: $DEPLOY_REPO would get these changes (nothing committed or pushed)."
          git diff --cached --stat
          git --no-pager diff --cached
          exit 0
        fi
        git commit -m "ci: Auto update Github Action workflows"
        git push
