version: 2
updates:
  # GitHub Actions referenced from workflows (.github/workflows), workflow
  # templates, and every composite action.yml under actions/.
  # Directories are listed explicitly: "/**" expands only one level deep, so it
  # never reached actions/<name>/action.yml. "/" covers .github/workflows.
  # deprecated/ (retired reusable workflows) is left out on purpose.
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/workflow-templates"
      - "/actions/*"
    schedule:
      interval: weekly
    groups:
      actions:
        # group-by dependency-name collapses the same action bump across every
        # directory it appears in into ONE pull request, instead of Dependabot's
        # default of one grouped PR per directory (there is one per action).
        group-by: dependency-name
        patterns:
          - "*"

  # Bundled Node actions: every directory under actions/ with a package.json.
  # group-by dependency-name consolidates a given package bump across all action
  # folders into a single PR. Minor + patch are grouped; majors still arrive
  # separately (one PR per package) so each can be canary-tested.
  # dependabot-rebuild.yml rebuilds dist/ on these PRs so check-dist passes.
  - package-ecosystem: npm
    directories:
      - "/actions/*"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        group-by: dependency-name
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major:
        group-by: dependency-name
        patterns:
          - "*"
        update-types:
          - "major"
