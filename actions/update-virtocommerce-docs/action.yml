name: 'Update docs.virtocommerce.org'
description: 'Makes and updates documentation for docs.virtocommerce.org'
inputs:
  azureSubscriptionId:
    description: "Azure Subscription ID"
    required: true
  azureResourceGroupName:
    description: "Azure Resource Group Name"
    required: true
  azureWebAppName:
    description: "Azure WebApp Name"
    required: true
  azureTenantId:
    description: ""
    required: true
  azureApiKey:
    description: ""
    required: true
  azureAppId:
    description: ""
    required: true
  dockerRegistry:
    description: "Docker Registry"
    required: true
  dockerUsr:
    description: "Docker User"
    required: true
  dockerPwd:
    description: "Docker Passsword"
    required: true
  

runs:
  using: "composite"
  steps:
    - name: Build docs
      shell: pwsh
      working-directory: ${{ github.workspace }}
      run: |
        #git clone https://github.com/VirtoCommerce/vc-platform.git --branch "master"
        git clone https://github.com/VirtoCommerce/vc-docs --branch "feature/structure_redesign"
        cd vc-docs
        ./build.ps1

    - name: Docker
      shell: pwsh
      working-directory: ${{ github.workspace }}
      env:
        DOCKER_USR_INPUT: ${{ inputs.dockerUsr }}
        DOCKER_PWD_INPUT: ${{ inputs.dockerPwd }}
        DOCKER_REGISTRY_INPUT: ${{ inputs.dockerRegistry }}
      run: |
        dotnet tool install --global VirtoCommerce.GlobalTool
        Copy-Item -Path ${{ github.action_path }}/docker/* -Destination ./ -Recurse -Force
        vc-build BuildAndPush -DockerUsername $env:DOCKER_USR_INPUT -DockerPassword $env:DOCKER_PWD_INPUT -DockerfilePath ./Dockerfile -DockerImageName "$($env:DOCKER_REGISTRY_INPUT)/vcpt/docs" -DockerImageTag $env:GITHUB_RUN_NUMBER -DockerRegistryUrl $env:DOCKER_REGISTRY_INPUT
        
