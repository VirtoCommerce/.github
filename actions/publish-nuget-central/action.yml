name: 'publish-nuget-central'
description: 'Publish NuGet packages through the central publisher repository (nuget.org Trusted Publishing)'
inputs:
  githubToken:
    description: 'Token that can dispatch and watch workflow runs in the publisher repository'
    required: true
  path:
    description: 'Folder with the .nupkg and .snupkg files to publish'
    required: false
    default: 'artifacts'
  publisherRepository:
    description: 'Repository whose workflow pushes to nuget.org'
    required: false
    default: 'VirtoCommerce/vc-nuget-publisher'
  publisherWorkflow:
    description: 'Workflow file in the publisher repository'
    required: false
    default: 'publish.yml'
outputs:
  publishRunUrl:
    description: 'URL of the publisher run that pushed the packages; empty when there were none'
    value: ${{ steps.publish.outputs.runUrl }}
runs:
  using: "composite"
  steps:
    # A module without NuGet packages (e.g. vc-module-admin-angular-js) packs nothing: nothing to publish.
    - name: Find packages
      id: find
      shell: bash
      env:
        PACKAGES_PATH: ${{ inputs.path }}
      run: |
        if compgen -G "$PACKAGES_PATH/*.nupkg" > /dev/null; then
          echo "found=true" >> "$GITHUB_OUTPUT"
        else
          echo "::notice::No .nupkg files in $PACKAGES_PATH, nothing to publish."
          echo "found=false" >> "$GITHUB_OUTPUT"
        fi

    # run_attempt in the name: a re-run must not collide with the artifact of the failed attempt.
    - name: Upload packages
      id: upload
      if: steps.find.outputs.found == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: nuget-packages-${{ github.job }}-${{ github.run_attempt }}
        path: |
          ${{ inputs.path }}/*.nupkg
          ${{ inputs.path }}/*.snupkg
        if-no-files-found: error
        retention-days: 1
        overwrite: true

    # The publisher checks that this run is in progress, so this step must wait for the push to finish.
    - name: Publish through the publisher repository
      id: publish
      if: steps.find.outputs.found == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.githubToken }}
        PUBLISHER_REPO: ${{ inputs.publisherRepository }}
        PUBLISHER_WORKFLOW: ${{ inputs.publisherWorkflow }}
        ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
      run: |
        # API version 2026-03-10 answers the dispatch with the id of the run it created.
        RUN_ID=$(gh api --method POST \
          -H "X-GitHub-Api-Version: 2026-03-10" \
          "repos/$PUBLISHER_REPO/actions/workflows/$PUBLISHER_WORKFLOW/dispatches" \
          -f ref=main \
          -f "inputs[repository]=$GITHUB_REPOSITORY" \
          -f "inputs[run_id]=$GITHUB_RUN_ID" \
          -f "inputs[artifact_id]=$ARTIFACT_ID" \
          --jq '.workflow_run_id')
        if ! [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
          echo "::error::Dispatch to $PUBLISHER_REPO/$PUBLISHER_WORKFLOW returned no run id."
          exit 1
        fi

        RUN_URL="$GITHUB_SERVER_URL/$PUBLISHER_REPO/actions/runs/$RUN_ID"
        echo "runUrl=$RUN_URL" >> "$GITHUB_OUTPUT"
        echo "Publishing in $RUN_URL"
        echo "NuGet publish run: $RUN_URL" >> "$GITHUB_STEP_SUMMARY"

        # Poll the run here rather than with gh run watch, which exits on the first API error:
        # the dispatch answers with the run id before the run is readable (404 for a few
        # seconds), and a short API error later must not fail a publish that is still going.
        # stderr goes to a file so a warning from gh cannot end up in the parsed status.
        MAX_ERRORS=6
        errors=0
        LAST_STATUS=
        ERR_FILE=$(mktemp)
        trap 'rm -f "$ERR_FILE"' EXIT
        while true; do
          STATUS= CONCLUSION=
          if RESPONSE=$(gh api "repos/$PUBLISHER_REPO/actions/runs/$RUN_ID" \
              --jq '(.status // "") + " " + (.conclusion // "")' 2>"$ERR_FILE"); then
            read -r STATUS CONCLUSION <<< "$RESPONSE"
          fi
          if [[ -n "$STATUS" ]]; then
            errors=0
            if [[ "$STATUS" != "$LAST_STATUS" ]]; then
              echo "Publisher run is $STATUS"
              LAST_STATUS=$STATUS
            fi
            [[ "$STATUS" == completed ]] && break
          else
            ERROR=$(tr '\n' ' ' < "$ERR_FILE")
            ERROR=${ERROR:-no status in the response}
            if (( ++errors >= MAX_ERRORS )); then
              echo "::error::Cannot read $RUN_URL ($MAX_ERRORS errors in a row): $ERROR"
              exit 1
            fi
            echo "Cannot read the publisher run yet ($errors/$MAX_ERRORS): $ERROR"
          fi
          sleep 10
        done

        if [[ "$CONCLUSION" != success ]]; then
          echo "::error::NuGet publish ended with '${CONCLUSION:-no conclusion}', see $RUN_URL"
          exit 1
        fi
