name: 'Publish Teams Webhook Notification'
description: 'Publish Teams Webhook Notification'
inputs:
  teamsWebhookUrl:
    description: 'Teams Webhook Url'
    required: true
  mentions:
    description: 'Mentions'
    required: true
    type: object
  title:
    description: 'Message Title'
    required: true
  workflowName:
    description: 'Workflow Name'
    required: true
  buildId:
    description: 'Build Id'
    required: true
  githubRepo:
    description: 'Github Repository'
    required: true

runs:
  using: "composite"
  steps:
    - name: Install Commerce Bundle Modules
      working-directory: ${{ github.action_path }}
      shell: pwsh
      env:
        TEAMS_WEBHOOK_URL_INPUT: ${{ inputs.teamsWebhookUrl }}
        MENTIONS_INPUT: ${{ inputs.mentions }}
        TITLE_INPUT: ${{ inputs.title }}
        WORKFLOW_NAME_INPUT: ${{ inputs.workflowName }}
        BUILD_ID_INPUT: ${{ inputs.buildId }}
        GITHUB_REPO_INPUT: ${{ inputs.githubRepo }}
      run: |
        # mentions is a PowerShell hashtable[] literal, e.g. '@(@{id = "..."; name = "..." })',
        # evaluated exactly as when it was inlined into this script.
        ./scripts/post-teams-notification.ps1 -teamsWebhookUrl "$env:TEAMS_WEBHOOK_URL_INPUT" -mentions (Invoke-Expression $env:MENTIONS_INPUT) -title "$env:TITLE_INPUT" -workflowName "$env:WORKFLOW_NAME_INPUT" -buildId "$env:BUILD_ID_INPUT" -githubRepo "$env:GITHUB_REPO_INPUT"